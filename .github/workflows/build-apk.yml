name: Build Debug APK (offline LLM, arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: |
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          ls app/src/main/cpp/llama.cpp | head -20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & NDK
        run: |
          set -e
          export SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH" >> $GITHUB_PATH
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android commandlinetools..."
            cd /tmp
            curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            unzip -q cmdtools.zip -d "$SDK_ROOT/cmdline-tools/tmp"
            mv "$SDK_ROOT/cmdline-tools/tmp/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"
            rm -rf "$SDK_ROOT/cmdline-tools/tmp" cmdtools.zip
          fi
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.1.12297006"
          echo "NDK installed:"
          ls "$SDK_ROOT/ndk" || true

      - name: Create Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 || {
              echo "gradle CLI not found, downloading Gradle 8.9..."
              cd /tmp
              curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
              unzip -q gradle.zip
              /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --project-dir "$GITHUB_WORKSPACE"
            }
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-llm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
